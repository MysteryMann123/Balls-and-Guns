<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balls &amp; Guns — Arsenal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="stats-body">
    <div class="page">

        <!-- Page header -->
        <div class="header">
            <div>
                <h1 class="title">Arsenal &amp; Utility</h1>
                <p class="subtitle">Live values sourced from weapon and constants modules.</p>
            </div>
            <div class="header-actions">
                <a class="link-btn menu-btn" href="index.html">Main Menu</a>
                <a class="link-btn play-btn" href="game.html">Quick Play</a>
            </div>
        </div>

        <!-- Tab buttons -->
        <div class="tabs">
            <button id="tab-weapons" class="tab-btn active" type="button">Weapons</button>
            <button id="tab-utilities" class="tab-btn" type="button">Utility Drops</button>
        </div>

        <!-- Detail panel (full width, top) -->
        <section class="panel detail-full-panel">
            <div class="detail-header">
                <div id="detail-img-wrap" class="detail-img-wrap hidden">
                    <img id="detail-img" class="detail-img" alt="Selected item image">
                </div>
                <div class="detail-text">
                    <h2 id="detail-title" class="detail-title">Select a weapon</h2>
                    <p id="detail-subtitle" class="detail-subtitle">Click any card below to inspect</p>
                </div>
            </div>
            <div id="detail-chips" class="chips"></div>
            <div class="notes-card">
                <h3 class="notes-title">Notes</h3>
                <ul id="detail-notes" class="notes"></ul>
            </div>
            <div id="dealer-table-wrap" class="dealer-table-wrap hidden">
                <table class="dealer-table">
                    <thead>
                        <tr>
                            <th>Hand</th>
                            <th>Base</th>
                            <th>Multiplier</th>
                        </tr>
                    </thead>
                    <tbody id="dealer-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- Weapon card grid (bottom) -->
        <div class="panel card-grid-panel">
            <div id="stats-list" class="list"></div>
        </div>

    </div>

<script type="module" src="./js/ui/stats/index.js"></script>
</body>
</html>
